<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBC Enerji</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #111b38;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .logo-img {
      max-width: 160px;
      max-height: 90px;
      width: auto;
      height: auto;
      object-fit: contain;
      margin-bottom: 18px;
      display: inline-block;
      border-radius: 8px;
    }
    h1 {
      font-size: 20px;
      letter-spacing: 1px;
      margin-bottom: 24px;
      color: #4cc9f0;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(76, 201, 240, 0.2);
      border-top-color: #4cc9f0;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 18px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Logoyu çeken satır -->
    <img src="bbc.jpeg" alt="BBC Enerji Logo" class="logo-img">

    <h1>BBC ENERJİ</h1>
    
    <div class="spinner"></div>

    <h2>Dijital Katalog Hazırlanıyor</h2>
    <p>Faaliyetlerimiz ve kurumsal tanıtım dosyamız çok yakında burada erişime açılacaktır.</p>
  </div>
</body>
</html>
